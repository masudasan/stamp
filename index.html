<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スタンプ帳 拡張ページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cover:#17342E;
    --cover-dark:#0E211D;
    --page:#F3ECDC;
    --page-alt:#EAE0C6;
    --ink:#241C15;
    --ink-soft:#5C5240;
    --stamp-red:#B23A2E;
    --stamp-red-dark:#8C2C22;
    --gold:#C69A3D;
    --line:rgba(36,28,21,0.16);
    --radius:14px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background:var(--cover);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.04), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,0.03), transparent 45%);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New", sans-serif;
  }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:28px 16px 60px;
  }

  /* ---- Header: 「証」looking title block ---- */
  header{
    text-align:center;
    color:var(--page);
    padding:18px 0 26px;
  }
  header .eyebrow{
    font-size:12px;
    letter-spacing:0.3em;
    color:var(--gold);
    margin-bottom:8px;
  }
  header h1{
    font-family:"Shippori Mincho", serif;
    font-weight:700;
    font-size:clamp(24px, 6vw, 34px);
    margin:0 0 6px;
    letter-spacing:0.06em;
  }
  header p{
    margin:0;
    font-size:13px;
    color:rgba(243,236,220,0.72);
    line-height:1.6;
  }

  /* ---- Auth card ---- */
  .pass{
    background:var(--page);
    border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    border:1px solid var(--line);
  }
  .pass .who{
    font-size:13px;
    color:var(--ink-soft);
  }
  .pass .who strong{
    display:block;
    font-size:15px;
    color:var(--ink);
    font-weight:700;
  }
  button.primary{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-weight:700;
    font-size:14px;
    padding:12px 20px;
    border-radius:999px;
    border:none;
    background:var(--stamp-red);
    color:#fff;
    cursor:pointer;
    letter-spacing:0.05em;
    transition:transform .15s ease, background .15s ease;
  }
  button.primary:hover{ background:var(--stamp-red-dark); }
  button.primary:active{ transform:scale(0.96); }
  button.primary:disabled{
    background:#B9AF98;
    cursor:default;
  }

  /* ---- Album page ---- */
  .album{
    margin-top:22px;
    background:var(--page);
    border-radius:var(--radius);
    box-shadow:0 14px 40px rgba(0,0,0,0.4);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .album-seam{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 20px;
    background:var(--page-alt);
    border-bottom:1px dashed var(--line);
    font-size:12px;
    color:var(--ink-soft);
  }
  .album-seam .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--gold);
    flex:none;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    padding:20px;
  }
  @media (min-width:560px){ .grid{ grid-template-columns:repeat(4, 1fr); } }
  @media (min-width:720px){ .grid{ grid-template-columns:repeat(5, 1fr); } }

  .stamp{
    position:relative;
    aspect-ratio:1/1;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    cursor:pointer;
    overflow:hidden;
    font-family:inherit;
    color:var(--ink);
  }
  .stamp .no{
    position:absolute;
    top:4px; left:6px;
    font-size:9px;
    color:var(--ink-soft);
    letter-spacing:0.05em;
  }
  .stamp .glyph{
    font-size:28px;
    line-height:1;
  }
  .stamp .label{
    font-size:10px;
    color:var(--ink-soft);
    text-align:center;
    padding:0 4px;
  }
  .stamp:disabled{ opacity:0.45; cursor:default; }
  .stamp:not(:disabled):active{ transform:scale(0.94); }

  /* ink stamp press effect */
  .stamp .ring{
    position:absolute;
    inset:0;
    border-radius:12px;
    border:2px solid var(--stamp-red);
    opacity:0;
    pointer-events:none;
  }
  .stamp.pressed .ring{
    animation:stampRing .5s ease-out;
  }
  @keyframes stampRing{
    0%{ opacity:0.9; transform:scale(0.7); }
    100%{ opacity:0; transform:scale(1.25); }
  }
  @media (prefers-reduced-motion: reduce){
    .stamp.pressed .ring{ animation:none; opacity:0.6; }
  }

  /* ---- Receipt log ---- */
  .log{
    margin-top:18px;
    background:rgba(243,236,220,0.06);
    border:1px solid rgba(243,236,220,0.18);
    border-radius:var(--radius);
    padding:14px 16px;
    color:var(--page);
    font-size:12px;
    max-height:150px;
    overflow-y:auto;
  }
  .log .title{
    font-size:11px;
    letter-spacing:0.15em;
    color:var(--gold);
    margin-bottom:8px;
  }
  .log .entry{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:4px 0;
    border-bottom:1px dotted rgba(243,236,220,0.15);
    opacity:0.85;
  }
  .log .entry:last-child{ border-bottom:none; }
  .log .empty{ opacity:0.5; }

  .banner{
    margin-top:14px;
    padding:10px 14px;
    border-radius:10px;
    font-size:12.5px;
    line-height:1.6;
  }
  .banner.error{ background:#3B1E1A; color:#F3D9D3; border:1px solid #6B342B; }
  .banner.info{ background:rgba(243,236,220,0.08); color:var(--page); border:1px solid rgba(243,236,220,0.18); }

  footer{
    text-align:center;
    color:rgba(243,236,220,0.4);
    font-size:11px;
    margin-top:26px;
    line-height:1.8;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">EXTRA STAMP PAGE</div>
    <h1 id="pageTitle">スタンプ帳 拡張ページ</h1>
    <p>公式のスタンプ枠がいっぱいのため、こちらのページから追加スタンプを送れます。<br>タップするとチャットにコマンドが送信され、配信画面に演出が出ます。</p>
  </header>

  <div class="pass">
    <div class="who" id="whoText">Twitchでログインすると、スタンプを押せるようになります。</div>
    <button class="primary" id="loginBtn">Twitchでログインする</button>
  </div>

  <div id="banners"></div>

  <div class="album">
    <div class="album-seam"><span class="dot"></span> 本家スタンプ枠の続き（No.51〜）・ここでしか押せない特別枠です</div>
    <div class="grid" id="grid"><!-- スタンプボタンはJSで生成 --></div>
  </div>

  <div class="log">
    <div class="title">押したスタンプの履歴</div>
    <div id="logList"><div class="entry empty">まだありません</div></div>
  </div>

  <footer>このページは配信者が独自に用意した拡張ツールです。Twitch公式のスタンプ機能とは別物です。</footer>
</div>

<script>
/* =====================================================================
   設定エリア（配信者が編集する部分）
   ===================================================================== */
const CONFIG = {
  // dev.twitch.tv/console/apps で作成したアプリの Client ID
  CLIENT_ID: "gbwqqal24445sy5s0v8uacrifaz5px",

  // 配信のチャンネルログイン名（URLの twitch.tv/●●● の部分・小文字）
  CHANNEL_LOGIN: "masudasan0506",

  // このページを実際に公開するURL（Twitchアプリ側の OAuth Redirect URL と
  // 1文字違わず完全一致させる必要があります。末尾のスラッシュ有無にも注意）
  REDIRECT_URI: "https://masudasan.github.io/",

  // ページ上部のタイトル
  TITLE: "スタンプ帳 拡張ページ",

  // 追加スタンプ一覧
  // trigger: たぬえさ3側の「チャットコマンド」トリガーに設定する文字列と完全一致させる
  // glyph  : とりあえず絵文字。画像にしたい場合は下のrender部分を <img src="..."> に差し替え可能
  STAMPS: [
    { no: 51, label: "ねこダンス",   img: "https://masudasan.github.io/gazou/dance01.png", trigger: "!dance01" },
    { no: 52, label: "拍手",      glyph: "👏", trigger: "!stamp_hakushu" },
    { no: 53, label: "びっくり",   glyph: "😳", trigger: "!stamp_bikkuri" },
    { no: 54, label: "感謝",      glyph: "🙏", trigger: "!stamp_kansha" },
    { no: 55, label: "花火",      glyph: "🎆", trigger: "!stamp_hanabi" },
    { no: 56, label: "ハート",    glyph: "💗", trigger: "!stamp_heart" },
    { no: 57, label: "笑",        glyph: "😂", trigger: "!stamp_warai" },
    { no: 58, label: "応援",      glyph: "📣", trigger: "!stamp_ouen" },
    { no: 59, label: "汗",        glyph: "💦", trigger: "!stamp_ase" },
    { no: 60, label: "祝",        glyph: "🎉", trigger: "!stamp_shuku" }
  ]
};
/* ===================================================================== */

document.getElementById('pageTitle').textContent = CONFIG.TITLE;

const els = {
  loginBtn: document.getElementById('loginBtn'),
  whoText: document.getElementById('whoText'),
  grid: document.getElementById('grid'),
  logList: document.getElementById('logList'),
  banners: document.getElementById('banners'),
};

let state = {
  accessToken: null,
  senderId: null,
  senderLogin: null,
  broadcasterId: null,
};

function showBanner(message, type){
  const div = document.createElement('div');
  div.className = 'banner ' + (type || 'info');
  div.textContent = message;
  els.banners.appendChild(div);
}

function buildGrid(){
  els.grid.innerHTML = '';
  CONFIG.STAMPS.forEach(stamp => {
    const btn = document.createElement('button');
    btn.className = 'stamp';
    btn.disabled = true;
    btn.innerHTML =
      '<span class="no">No.' + stamp.no + '</span>' +
      '<span class="img"><img src="https://masudasan.github.io/gazou/dance01.png" alt=""></span>' +
      '<span class="label">' + stamp.label + '</span>' +
      '<span class="ring"></span>';
    btn.addEventListener('click', () => sendStamp(stamp, btn));
    els.grid.appendChild(btn);
  });
}
buildGrid();

function setStampsEnabled(enabled){
  document.querySelectorAll('.stamp').forEach(b => b.disabled = !enabled);
}

/* ---------- OAuth (Implicit flow, サーバー不要) ---------- */

function startLogin(){
  const params = new URLSearchParams({
    client_id: CONFIG.CLIENT_ID,
    redirect_uri: CONFIG.REDIRECT_URI,
    response_type: 'token',
    scope: 'user:write:chat',
    state: crypto.randomUUID ? crypto.randomUUID() : String(Date.now())
  });
  window.location.href = 'https://id.twitch.tv/oauth2/authorize?' + params.toString();
}

els.loginBtn.addEventListener('click', startLogin);

async function handleRedirect(){
  if (!window.location.hash) return;
  const hash = new URLSearchParams(window.location.hash.slice(1));
  const token = hash.get('access_token');
  const error = hash.get('error_description');

  // 見た目を綺麗にするためURLからハッシュを消す
  history.replaceState(null, '', window.location.pathname);

  if (error){
    showBanner('ログインでエラーが発生しました: ' + error, 'error');
    return;
  }
  if (!token) return;

  state.accessToken = token;
  await afterLogin();
}

async function twitchApi(path, options){
  const res = await fetch('https://api.twitch.tv/helix' + path, Object.assign({
    headers: {
      'Authorization': 'Bearer ' + state.accessToken,
      'Client-Id': CONFIG.CLIENT_ID,
      'Content-Type': 'application/json'
    }
  }, options));
  const data = await res.json().catch(() => ({}));
  if (!res.ok){
    throw new Error((data && data.message) ? data.message : ('APIエラー(' + res.status + ')'));
  }
  return data;
}

async function afterLogin(){
  els.loginBtn.disabled = true;
  els.loginBtn.textContent = '確認中…';
  try{
    // 自分自身の情報
    const me = await twitchApi('/users');
    const myUser = me.data && me.data[0];
    if (!myUser) throw new Error('ユーザー情報の取得に失敗しました');
    state.senderId = myUser.id;
    state.senderLogin = myUser.login;

    // 配信チャンネルの情報
    const ch = await twitchApi('/users?login=' + encodeURIComponent(CONFIG.CHANNEL_LOGIN));
    const chUser = ch.data && ch.data[0];
    if (!chUser) throw new Error('チャンネル「' + CONFIG.CHANNEL_LOGIN + '」が見つかりません。CONFIG.CHANNEL_LOGINを確認してください');
    state.broadcasterId = chUser.id;

    els.whoText.innerHTML = '<strong>' + state.senderLogin + '</strong> としてログイン中';
    els.loginBtn.textContent = 'ログイン済み';
    setStampsEnabled(true);
  }catch(err){
    showBanner('ログイン処理に失敗しました: ' + err.message, 'error');
    els.loginBtn.disabled = false;
    els.loginBtn.textContent = 'Twitchでログインする';
  }
}

/* ---------- スタンプ送信 ---------- */

async function sendStamp(stamp, btn){
  if (!state.accessToken){
    showBanner('先にTwitchでログインしてください', 'error');
    return;
  }
  btn.disabled = true;
  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 500);

  try{
    await twitchApi('/chat/messages', {
      method: 'POST',
      body: JSON.stringify({
        broadcaster_id: state.broadcasterId,
        sender_id: state.senderId,
        message: stamp.trigger
      })
    });
    addLog(stamp.label, true);
  }catch(err){
    addLog(stamp.label, false, err.message);
  }finally{
    btn.disabled = false;
  }
}

function addLog(label, ok, errMsg){
  if (els.logList.querySelector('.empty')) els.logList.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'entry';
  const time = new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  row.innerHTML = '<span>' + time + ' ' + label + '</span><span>' + (ok ? '押印✓' : ('失敗: ' + errMsg)) + '</span>';
  els.logList.prepend(row);
}

handleRedirect();
</script>
</body>
</html>
